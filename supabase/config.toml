# StayQR Edge Function deployment configuration.
# Gateway JWT verification is disabled because the project uses asymmetric
# ES256 signing keys. manage-staff-user verifies the bearer token itself with
# Supabase Auth before any service-role operation.

[functions.manage-staff-user]
verify_jwt = false

[functions.cashfree-health]
verify_jwt = false

[functions.cashfree-create-payment-link]
verify_jwt = false

[functions.cashfree-create-self-service-checkout]
verify_jwt = false

[functions.cashfree-webhook]
verify_jwt = false

[functions.cashfree-recurring]
verify_jwt = false

[functions.cashfree-subscription-webhook]
verify_jwt = false

# Post-Launch Batch 3 / Batch C. These functions perform their own authorization
# or webhook signature verification and therefore must bypass legacy gateway JWT
# verification (the project uses asymmetric signing keys).
[functions.verify-aadhaar-offline]
verify_jwt = false

[functions.uidai-online-auth]
verify_jwt = false

[functions.whatsapp-send]
verify_jwt = false

[functions.whatsapp-status-webhook]
verify_jwt = false

[functions.purge-guest-retention]
verify_jwt = false
